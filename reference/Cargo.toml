[workspace]
resolver = "2"
members = [
    "crates/sansacloth-core",
    "crates/sansacloth-fixture",
    "crates/sansacloth-reference",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mayusaki3/SansaCloth"

[workspace.dependencies]
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
